# The version floor (docs/DESIGN.md#engine-and-data, #testing, G0): the integration tests under real VS Code 1.105 and older
# versions, to find the oldest that passes and set engines.vscode from it. Prepared on the laptop before G0 and not
# yet run; VS Code 1.105 is never installed on a development machine (docs/DESIGN.md#rules); this runs on GitHub only.
#
# Run by hand with a list of versions, newest first; each version is one Linux job (the cheapest runner). Each job
# first sets engines.vscode to the version it tests (build gate 2, G2E-09): VS Code refuses to load an extension
# whose engines field asks for a newer version, and that refusal would hide which API call really fails. A job
# that fails then shows the missing API in the test output. The result is recorded in the README and the store
# text; if the floor ends above 1.105, they say which forks cannot install the extension and why.

name: floor

on:
  workflow_dispatch:
    inputs:
      versions:
        description: VS Code versions to test, as a JSON list
        default: '["1.105.0", "1.104.0", "1.103.0", "1.102.0", "1.101.0", "1.100.0"]'
  push:
    tags:
      - 'v*-rc*'

permissions:
  contents: read

jobs:
  floor:
    strategy:
      fail-fast: false
      matrix:
        vscode: ${{ fromJSON(inputs.versions || '["1.105.0"]') }}
    uses: ./.github/workflows/test-runner.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      vscode-version: ${{ matrix.vscode }}
      engine: false
      floor: true
