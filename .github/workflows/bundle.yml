# B1, the bundle builder (docs/DESIGN.md#engine-and-data), on GitHub only. It builds core-data and extra-data from the
# pinned TeX Live snapshot (engine/bundle-pins.json) and the selection (engine/bundle-sets.json). The extension's own
# engine builds the formats and runs the closure test. The public corpus is then compared with a TeX Live installed
# as the reference. Run by hand (Actions, bundle, Run workflow); first run on 2026-10-31.
#
# The jobs. Each has its own time limit and keeps its own report, also when it fails (build gate B1, GB1E-03):
# - pin (job: pin): fetches the snapshot's tlpdb and TeX Live's signed checksum of it. gpg verifies the signature
#   with TeX Live's key, whose fingerprint engine/bundle-pins.json pins (GB1E-02). The builder then checks that the
#   signed SHA-512 is the tlpdb's, runs the selection, and lists every package whose licence is not plainly free
#   or unknown (GB1E-01). Read the lists, then commit the printed "tlpdb" entry into engine/bundle-pins.json.
# - fetch: every archive into the cache, each checked against the tlpdb's SHA-512. The cache is saved even when
#   the fetch fails, so a second attempt downloads only what is missing. curl downloads, not the builder:
#   texlive.info runs a bot check (Anubis) that gives a browser, and Node's fetch, a challenge page, while curl gets
#   the files. The builder lists what to
#   download and checks it, and opens no connection itself (--local).
# - build: unpacks, generates, builds the formats, the images and the two data packages. The packages' SHA-256 goes
#   into the job summary before any later job runs.
# - closure (input closure: core by default, so a first run judges the core first): each class and package of the
#   chosen set loads alone, on the packages as they ship, sharded over 4 or 8 runners.
# - corpus: the public corpus on the built packages.
# - reference: TeX Live's installer, verified with the same key, installs the collections the bundle draws from and
#   the build's packages into the runner's temp folder, without root; then the corpus is compiled again and the
#   page counts compared. install-tl and tlmgr are TeX Live's own Perl programs, run in this job only, outside the
#   builder, after the packages are sealed (GB1E-07, GB1E-08). It downloads only the corpus and the selection.
# - release (input release, on main only, after the closure, corpus and reference jobs passed): each data package of
#   the build into a draft release of its own, with the sources of what it ships, checked (the job's own comment,
#   below). The owner publishes the drafts once checked.
#
# The minutes on 2-vCPU runners, measured on the first run (core closure, 4 shards, reference on): fetch 7 (2950
# archives from one host), build 3, closure 1 to 2 per shard, corpus 4, reference 10. Not yet measured: pin, about
# 5; the add-on's closure test (closure: extra or all, 8 shards); and the release, about 15 to 30 (about 130 MB of
# core-data's sources and 180 MB of extra-data's, from the snapshot, and about 680 MB of uploads: the two packages,
# their sources, and the tlpdb once for each). Artifacts are kept 3 days (the packages, about 250 MB each) to 7 days
# (reports), within the repository's artifact storage.

name: bundle

on:
  workflow_dispatch:
    inputs:
      job:
        description: pin (check TeX Live's signature, list the licences, print the pin) or build (everything after)
        type: choice
        options: [build, pin]
      closure:
        description: The closure test's set (core first; extra or all once the core passes; none to skip it)
        type: choice
        options: [core, extra, all, none]
        default: core
      shards:
        description: Runners for the closure test
        type: choice
        options: ['4', '8']
        default: '4'
      reference:
        description: Compare the corpus with a TeX Live installed as the reference
        type: boolean
        default: true
      version:
        description: The data sets' version (default the snapshot's date)
        required: false
        type: string
        default: ''
      release:
        description: Also make the draft releases of the two data packages (on main only)
        type: boolean
        default: false
      candidate:
        description: The candidate number n of the tags core-data-<engine short hash>-<n> and extra-data-<engine short hash>-<n>
        type: string
        default: '1'

permissions:
  contents: read

jobs:
  pin:
    if: inputs.job == 'pin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TeX Live's signed checksum of the tlpdb, verified with gpg and the pinned key (on the runner only)
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(node -p "require('./engine/bundle-pins.json').signingKey.fingerprint")
          MIRROR=$(node -p "const p=require('./engine/bundle-pins.json');p.mirrors[0].replace('{snapshot}',p.snapshot)")
          WORK="$RUNNER_TEMP/pin" && mkdir -p "$WORK"
          export GNUPGHOME="$WORK/gnupg" && mkdir -m 700 "$GNUPGHOME"
          curl -fsSL --retry 3 -o "$WORK/texlive.tlpdb.sha512" "${MIRROR}tlpkg/texlive.tlpdb.sha512"
          curl -fsSL --retry 3 -o "$WORK/texlive.tlpdb.sha512.asc" "${MIRROR}tlpkg/texlive.tlpdb.sha512.asc"
          curl -fsSL --retry 3 --create-dirs -o "$WORK/tlnet/tlpkg/texlive.tlpdb.xz" "${MIRROR}tlpkg/texlive.tlpdb.xz"
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys "$KEY" || gpg --batch --keyserver hkps://keys.openpgp.org --recv-keys "$KEY"
          gpg --batch --status-file "$WORK/gpg-status.txt" --verify "$WORK/texlive.tlpdb.sha512.asc" "$WORK/texlive.tlpdb.sha512"
          # VALIDSIG's last field is the primary key's fingerprint: the builder checks it against the pin.
          SIGNER=$(awk '$2 == "VALIDSIG" { print $NF }' "$WORK/gpg-status.txt")
          test -n "$SIGNER"
          echo "SIGNED_BY=$SIGNER" >> "$GITHUB_ENV"
      - name: The tlpdb against the signed checksum; the selection and its licences; the entry to pin
        run: node scripts/build-bundle.mjs --stage pin --local "$RUNNER_TEMP/pin/tlnet" --signed-sha512 "$RUNNER_TEMP/pin/texlive.tlpdb.sha512" --signed-by "$SIGNED_BY" --out "$RUNNER_TEMP/bundle-out"
      - name: The pin report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report-pin
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/bundle-out/report-pin.*

  fetch:
    if: inputs.job == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TeX Live archives from earlier runs of this snapshot
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bundle-cache
          key: bundle-archives-${{ hashFiles('engine/bundle-pins.json') }}-${{ github.run_id }}
          restore-keys: bundle-archives-${{ hashFiles('engine/bundle-pins.json') }}-
      - name: Download every archive with curl, then check each against the tlpdb's SHA-512
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$RUNNER_TEMP/bundle-cache"
          MIRROR=$(node -p "const p=require('./engine/bundle-pins.json');p.mirrors[0].replace('{snapshot}',p.snapshot)")
          [ -f "$CACHE/tlpkg/texlive.tlpdb.xz" ] || curl -fsSL --retry 3 --create-dirs -o "$CACHE/tlpkg/texlive.tlpdb.xz" "${MIRROR}tlpkg/texlive.tlpdb.xz"
          # The builder lists what the cache lacks; curl downloads it; the builder then checks every archive.
          node scripts/build-bundle.mjs --stage fetch --local "$CACHE" --curl-config "$RUNNER_TEMP/to-fetch.curl" --out "$RUNNER_TEMP/bundle-out"
          if [ -s "$RUNNER_TEMP/to-fetch.curl" ]; then
            curl --parallel --parallel-max 3 --create-dirs -fsSL --retry 3 -K "$RUNNER_TEMP/to-fetch.curl" || echo "::warning::Some archives did not download; the check below names them."
          fi
          node scripts/build-bundle.mjs --stage fetch --local "$CACHE" --out "$RUNNER_TEMP/bundle-out"
      - name: Keep the archives, also when the fetch failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bundle-cache
          key: bundle-archives-${{ hashFiles('engine/bundle-pins.json') }}-${{ github.run_id }}
      - name: The fetch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report-fetch
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/bundle-out/report-fetch.*

  build:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from the lockfile
        run: npm ci --omit=optional
      - name: Engine inputs (cached by the pins)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../engine_assets
          key: engine-assets-${{ hashFiles('engine/pins.json') }}
      - name: The engine, its host and the client (the builder needs no engine image)
        run: |
          node scripts/engine-assets.mjs
          node scripts/build.mjs
          npm run compile
      - name: The archives the fetch job checked
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bundle-cache
          key: bundle-archives-${{ hashFiles('engine/bundle-pins.json') }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Build core-data and extra-data
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/build-bundle.mjs --stage build --local "$RUNNER_TEMP/bundle-cache" --out "$RUNNER_TEMP/bundle-out" ${VERSION:+--version "$VERSION"}
      - name: The data packages' SHA-256 and the report, in the job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Data packages (SHA-256)'
            echo '```'
            (cd "$RUNNER_TEMP/bundle-out" && sha256sum ./*.vsix) || echo 'no data package was built'
            echo '```'
            echo '### Build report'
            echo '```'
            cat "$RUNNER_TEMP/bundle-out/report-build.txt" || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The data packages
        uses: actions/upload-artifact@v4
        with:
          name: bundle-packages
          retention-days: 3
          compression-level: 0
          path: ${{ runner.temp }}/bundle-out/*.vsix
      - name: The build report and lists
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-build
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/bundle-out/report-build.*
            ${{ runner.temp }}/bundle-out/closure-targets.json
            ${{ runner.temp }}/bundle-out/selection.json
            ${{ runner.temp }}/bundle-out/*/data/manifest.json
            ${{ runner.temp }}/bundle-out/*/data/licences.json

  closure:
    needs: build
    if: inputs.closure != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards == '8' && '[0, 1, 2, 3, 4, 5, 6, 7]' || '[0, 1, 2, 3]') }}
    env:
      CI: 'true'
      SCOPE: ${{ inputs.closure }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ inputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from the lockfile
        run: npm ci --omit=optional
      - name: Engine inputs (cached by the pins)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../engine_assets
          key: engine-assets-${{ hashFiles('engine/pins.json') }}
      - name: The engine, its host and the client
        run: |
          node scripts/engine-assets.mjs
          node scripts/build.mjs
          npm run compile
      - name: The data packages
        uses: actions/download-artifact@v4
        with:
          name: bundle-packages
          path: ${{ runner.temp }}/packages
      - name: The build's lists
        uses: actions/download-artifact@v4
        with:
          name: bundle-build
          path: ${{ runner.temp }}/bundle-out
      - name: The data, unpacked from the packages as they ship
        shell: bash
        run: |
          set -euo pipefail
          for set in core-data extra-data; do
            unzip -q "$RUNNER_TEMP"/packages/livemd2tex-$set-*.vsix 'extension/data/*' -d "$RUNNER_TEMP/unpack-$set"
            rm -rf "$RUNNER_TEMP/bundle-out/$set/data" && mkdir -p "$RUNNER_TEMP/bundle-out/$set"
            mv "$RUNNER_TEMP/unpack-$set/extension/data" "$RUNNER_TEMP/bundle-out/$set/data"
          done
      - name: The closure test, this shard
        run: node scripts/build-bundle.mjs --stage closure --closure "$SCOPE" --shard "$SHARD/$SHARDS" --out "$RUNNER_TEMP/bundle-out"
      - name: The shard's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-closure-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/bundle-out/report-closure.*
            ${{ runner.temp }}/bundle-out/closure-*-of-*.json

  corpus:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from the lockfile
        run: npm ci --omit=optional
      - name: Engine inputs (cached by the pins)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../engine_assets
          key: engine-assets-${{ hashFiles('engine/pins.json') }}
      - name: The engine, its host and the client
        run: |
          node scripts/engine-assets.mjs
          node scripts/build.mjs
          npm run compile
          node scripts/stage-engine.mjs
      - name: The data packages
        uses: actions/download-artifact@v4
        with:
          name: bundle-packages
          path: ${{ runner.temp }}/packages
      - name: The data, unpacked from the packages as they ship
        shell: bash
        run: |
          set -euo pipefail
          for set in core-data extra-data; do
            unzip -q "$RUNNER_TEMP"/packages/livemd2tex-$set-*.vsix 'extension/data/*' -d "$RUNNER_TEMP/unpack-$set"
            mkdir -p "$RUNNER_TEMP/bundle-out/$set"
            mv "$RUNNER_TEMP/unpack-$set/extension/data" "$RUNNER_TEMP/bundle-out/$set/data"
          done
      - name: The public corpus on the built packages
        env:
          LIVEMD2TEX_BUNDLE_OUT: ${{ runner.temp }}/bundle-out
        run: |
          npx mocha --config .mocharc.engine.cjs --grep "B1: the public corpus on the built bundle" out/test/engine/bundleCorpus.test.js
      - name: The corpus and its page counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-corpus
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/bundle-out/corpus-bundle.json
            ${{ runner.temp }}/bundle-out/corpus/

  reference:
    needs: corpus
    if: inputs.reference
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install from the lockfile
        run: npm ci --omit=optional
      - name: The corpus
        uses: actions/download-artifact@v4
        with:
          name: bundle-corpus
          path: ${{ runner.temp }}/bundle-out
      - name: The build's selection
        uses: actions/download-artifact@v4
        with:
          name: bundle-build
          path: ${{ runner.temp }}/bundle-out
      - name: TeX Live's installer from the snapshot, verified with gpg and the pinned key
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(node -p "require('./engine/bundle-pins.json').signingKey.fingerprint")
          MIRROR=$(node -p "const p=require('./engine/bundle-pins.json');p.mirrors[0].replace('{snapshot}',p.snapshot)")
          WORK="$RUNNER_TEMP/install-tl" && mkdir -p "$WORK/installer"
          export GNUPGHOME="$WORK/gnupg" && mkdir -m 700 "$GNUPGHOME"
          cd "$WORK"
          for f in install-tl-unx.tar.gz install-tl-unx.tar.gz.sha512 install-tl-unx.tar.gz.sha512.asc; do
            curl -fsSL --retry 3 -o "$f" "${MIRROR}$f"
          done
          gpg --batch --keyserver hkps://keyserver.ubuntu.com --recv-keys "$KEY" || gpg --batch --keyserver hkps://keys.openpgp.org --recv-keys "$KEY"
          gpg --batch --status-file gpg-status.txt --verify install-tl-unx.tar.gz.sha512.asc install-tl-unx.tar.gz.sha512
          test "$(awk '$2 == "VALIDSIG" { print $NF }' gpg-status.txt)" = "$KEY"
          sha512sum -c install-tl-unx.tar.gz.sha512
          tar -xzf install-tl-unx.tar.gz -C installer --strip-components=1
      - name: The reference TeX Live, in the runner's temp folder without root (install-tl and tlmgr are TeX Live's Perl, outside the builder)
        shell: bash
        run: |
          set -euo pipefail
          TL="$RUNNER_TEMP/texlive"
          MIRROR=$(node -p "const p=require('./engine/bundle-pins.json');p.mirrors[0].replace('{snapshot}',p.snapshot)")
          node scripts/bundle-reference.mjs --profile "$TL" > "$RUNNER_TEMP/install-tl/reference.profile"
          cd "$RUNNER_TEMP/install-tl/installer"
          perl ./install-tl --profile "$RUNNER_TEMP/install-tl/reference.profile" --repository "$MIRROR"
          BIN=$(ls -d "$TL"/bin/*)
          "$BIN/tlmgr" install $(node "$GITHUB_WORKSPACE/scripts/bundle-reference.mjs" --packages "$RUNNER_TEMP/bundle-out/selection.json")
          echo "$BIN" >> "$GITHUB_PATH"
      - name: The public corpus on TeX Live, compared
        run: node scripts/bundle-reference.mjs --out "$RUNNER_TEMP/bundle-out"
      - name: The comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-reference
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/bundle-out/corpus-reference.json

  # The release (input release, on main only): the two data packages of this run's build, each made into a draft
  # release of its own, core-data-<engine short hash>-<n> and extra-data-<engine short hash>-<n> (the short hash is
  # that of the engine.wasm both are built for, their abi; scripts/data-release.mjs says why two releases). Each draft
  # holds the package, the sources of what it ships (the pinned snapshot's archives of its GPL, LGPL and AGPL packages
  # and packed GPL fonts, each checked against the pinned tlpdb's SHA-512 by scripts/release-sources.mjs, as
  # release-sources.yml does for an extension release, and the list itself checked against the tlpdb by
  # scripts/data-release.mjs), sources.json, the pinned tlpdb and the package's LICENSES/. It waits for the build,
  # closure, corpus and reference jobs and makes no draft unless all four passed, with the closure test on both sets
  # (closure: all), so a draft never comes from a run whose checks failed; it runs within the packages' 3-day artifact
  # window. Every loop reads its list on descriptor 3, so no command inside can take a line. The owner publishes each
  # draft once it is checked; nothing here publishes, tags or pushes.
  release:
    needs: [build, closure, corpus, reference]
    if: ${{ !cancelled() && inputs.job == 'build' && inputs.release && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: data-release
      cancel-in-progress: false
    env:
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - name: The release runs on main, with a candidate number, after the run's checks passed
        env:
          BUILD: ${{ needs.build.result }}
          CLOSURE: ${{ needs.closure.result }}
          CLOSURE_SET: ${{ inputs.closure }}
          CORPUS: ${{ needs.corpus.result }}
          REFERENCE: ${{ needs.reference.result }}
        run: |
          case "$CANDIDATE" in ''|*[!0-9]*|0*) echo "candidate must be a number from 1" >&2; exit 1 ;; esac
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "a release runs on main only, not $GITHUB_REF" >&2; exit 1; }
          [ "$BUILD $CLOSURE $CORPUS $REFERENCE $CLOSURE_SET" = 'success success success success all' ] || {
            echo "no drafts: the release needs the build, closure (closure: all), corpus and reference jobs to pass; this run gave build $BUILD, closure $CLOSURE (closure: $CLOSURE_SET), corpus $CORPUS, reference $REFERENCE" >&2
            exit 1
          }
      # actions/checkout v4.4.0, actions/setup-node v4.4.0, actions/download-artifact v4.3.0 and
      # actions/upload-artifact v4.6.2, pinned by commit, as in engine.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bundle-packages
          path: ${{ runner.temp }}/packages
      - name: The two packages against the pinned engine and each other, and their tags
        run: node scripts/data-release.mjs plan --packages "$RUNNER_TEMP/packages" --candidate "$CANDIDATE" --out "$RUNNER_TEMP/release"
      - name: Each package's sources, listed, downloaded with curl and checked against the pinned tlpdb
        run: |
          set -euo pipefail
          while IFS="$(printf '\t')" read -r -u 3 set tag vsix; do
            node scripts/release-sources.mjs list --out "$RUNNER_TEMP/release/$set" --tag "$tag" "$vsix"
            curl --fail --location --retry 3 --create-dirs --parallel --parallel-max 4 -K "$RUNNER_TEMP/release/$set/sources.curl"
            node scripts/release-sources.mjs check --out "$RUNNER_TEMP/release/$set"
          done 3< "$RUNNER_TEMP/release/releases.tsv"
      - name: Each release's files and notes
        run: |
          set -euo pipefail
          while IFS="$(printf '\t')" read -r -u 3 set tag vsix; do
            d="$RUNNER_TEMP/release/$set"
            mkdir -p "$d/files/$set" "$d/assets" "$d/licences"
            tar -cf "$d/assets/$tag-sources.tar" -C "$d/files/$set" .
            # '**' crosses "/" in every unzip build ('*' does not in some), and the count proves that the tar holds
            # every file of the package's LICENSES/.
            unzip -q "$vsix" 'extension/LICENSES/**' -d "$d/licences"
            want="$(unzip -Z1 "$vsix" | grep -c '^extension/LICENSES/.*[^/]$')"
            got="$(find "$d/licences/extension/LICENSES" -type f | wc -l)"
            [ "$got" = "$want" ] || { echo "$tag: LICENSES/ holds $got of the package's $want files" >&2; exit 1; }
            echo "$tag: LICENSES/ holds the package's $want files"
            tar -cf "$d/assets/$tag-LICENSES.tar" -C "$d/licences/extension" LICENSES
            cp "$vsix" "$d/sources.json" "$d/meta/texlive.tlpdb.xz" "$d/assets/"
            node scripts/data-release.mjs notes --set "$set" --tag "$tag" --vsix "$vsix" --sources "$d" --commit "$GITHUB_SHA" --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --out "$d/notes.md"
            (cd "$d/assets" && sha256sum -- *) > "$d/assets.sha256"
          done 3< "$RUNNER_TEMP/release/releases.tsv"
      - name: The draft releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/release/releases.tsv"
          [ "$(wc -l < "$list")" -eq 2 ] || { echo "the plan holds $(wc -l < "$list") releases, not 2" >&2; exit 1; }
          # Both tags must be free before either draft is made: GitHub ignores --target when the tag exists, and a
          # release of that tag, draft or not, would be another candidate's. git ls-remote gives 0 for a tag that
          # exists and 2 for none; any other status is an error, never "free".
          while IFS="$(printf '\t')" read -r -u 3 set tag vsix; do
            s=0
            git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$tag" >/dev/null || s=$?
            case "$s" in
              0) echo "the tag $tag exists already" >&2; exit 1 ;;
              2) ;;
              *) echo "git ls-remote failed (status $s), so the tag $tag is not known to be free" >&2; exit 1 ;;
            esac
            taken="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | .id")"
            [ -z "$taken" ] || { echo "a release of $tag exists already" >&2; exit 1; }
            echo "the tag $tag is free"
          done 3< "$list"
          # Then the drafts. Each must hold every assembled file, by name and size.
          made=0
          while IFS="$(printf '\t')" read -r -u 3 set tag vsix; do
            d="$RUNNER_TEMP/release/$set"
            assets=("$d"/assets/*)
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file "$d/notes.md" "${assets[@]}"
            made=$((made + 1))
            want="$(cd "$d/assets" && for f in *; do printf '%s %s\n' "$f" "$(stat -c %s "$f")"; done | sort)"
            got="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort)"
            [ "$got" = "$want" ] || { echo "the draft $tag does not hold the assembled files, by name and size:" >&2; diff <(echo "$want") <(echo "$got") >&2 || true; exit 1; }
            echo "the draft $tag holds its ${#assets[@]} files, each by name and size"
          done 3< "$list"
          [ "$made" -eq 2 ] || { echo "$made drafts made, not 2" >&2; exit 1; }
      - name: The release's files' SHA-256 and the notes, in the job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Data releases: the SHA-256 of each file, as <tag>/<file>'
            echo '```'
            if [ -s "$RUNNER_TEMP/release/releases.tsv" ]; then
              while IFS="$(printf '\t')" read -r -u 3 set tag vsix; do
                if [ -f "$RUNNER_TEMP/release/$set/assets.sha256" ]; then
                  awk -v tag="$tag" '{ print $1 "  " tag "/" $2 }' "$RUNNER_TEMP/release/$set/assets.sha256"
                else
                  echo "$tag: not assembled"
                fi
              done 3< "$RUNNER_TEMP/release/releases.tsv"
            else
              echo 'no release was planned'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The release report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bundle-release
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/release/releases.tsv
            ${{ runner.temp }}/release/*/sources.json
            ${{ runner.temp }}/release/*/notes.md
            ${{ runner.temp }}/release/*/assets.sha256
