<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The extension's fontconfig file for XeTeX (docs/DESIGN.md#rules: bundle folders only). It names the bundle's
  OpenType and TrueType folders, so \setmainfont{TeX Gyre Pagella} works by name, and the same folders of the
  data extensions mounted under /texmf-extra, so an add-on's fonts work by name once it is installed. It leaves
  out the Type 1 folders (1,319 files, 95.7 MB in TeXlyre's image), which XeTeX would otherwise scan on every
  run; Type 1 fonts still load by file name through kpathsea. Fontconfig writes its cache to /engine/fc-cache,
  one file per folder. The engine host keeps the files and gives them to later compiles; the add-ons' folders
  carry a time stamp of their own, so they are scanned again when an add-on is mounted or updated.
-->
<fontconfig>
  <dir>/texlive/texmf-dist/fonts/opentype</dir>
  <dir>/texlive/texmf-dist/fonts/truetype</dir>
  <dir>/texmf-extra/fonts/opentype</dir>
  <dir>/texmf-extra/fonts/truetype</dir>
  <cachedir>/engine/fc-cache</cachedir>
</fontconfig>
